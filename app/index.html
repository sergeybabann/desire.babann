<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.min.css" />
  </head>

  <body>
    <!---------- HEADER ---------->
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <nav class="menu">
            <ul class="menu__list">
              <li class="menu__list-item">
                <a href="" class="menu__list-link">About</a>
              </li>
              <li class="menu__list-item">
                <a href="" class="menu__list-link">Gallery</a>
              </li>
            </ul>
          </nav>
          <a href="#" class="logo">
            <img src="images/logo.png" alt="logo" />
          </a>
          <nav class="menu">
            <ul class="menu__list">
              <li class="menu__list-item">
                <a href="" class="menu__list-link">Blog</a>
              </li>
              <li class="menu__list-item">
                <a href="" class="menu__list-link">Contact</a>
              </li>
            </ul>
          </nav>

          <button class="header__btn">
            <img src="images/icon_menu.svg" alt="icon menu" />
          </button>
        </div>
      </div>
    </header>

    <!----- WRAPPER ----->
    <div class="wrapper">
      <!----- MAIN ----->
      <main class="main"></main>

      <!----- FOOTER ----->
      <footer class="footer">
        <div class="footer__content">
          <div class="container">
            <div class="footer__inner">
              <div class="footer__info">
                <h6 class="footer__info-title">Contact Us</h6>
                <p class="footer__info-text">
                  Keffiyeh poutine etsy, paleo cray put a bird on it microdosing
                  schlitz you probably occupy
                </p>
                <a
                  href="mailto:ouremailaddress@email.com"
                  class="footer__info-email"
                >
                  ouremailaddress@email.com
                </a>
                <form class="footer__form">
                  <input
                    type="email"
                    class="footer__form-input"
                    placeholder="Subscribe by email"
                  />
                  <button class="footer__form-button" type="submit">
                    Send
                  </button>
                </form>
              </div>
              <ul class="footer__social">
                <li class="footer__social-item">
                  <a href="#" class="footer__social-link">Facebook</a>
                </li>
                <li class="footer__social-item">
                  <a href="#" class="footer__social-link">Instagram</a>
                </li>
                <li class="footer__social-item">
                  <a href="#" class="footer__social-link">Pinterest</a>
                </li>
                <li class="footer__social-item">
                  <a href="#" class="footer__social-link">WhatsApp</a>
                </li>
                <li class="footer__social-item">
                  <a href="#" class="footer__social-link">Youtube</a>
                </li>
              </ul>
              <nav class="footer__menu">
                <ul class="footer__menu-list"></ul>
              </nav>
            </div>
          </div>
        </div>
        <div class="footer__copyright">
          674 Gonzales Drive. Washington, PA 15301
        </div>
      </footer>
    </div>
    <!--wrapper-->

    <script src="js/main.min.js"></script>
  </body>
</html>
